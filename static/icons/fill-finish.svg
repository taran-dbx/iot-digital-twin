<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Conveyor belt frame -->
  <rect x="10" y="70" width="180" height="12" rx="6" fill="#8b8fa3"/>
  <!-- Rollers -->
  <circle cx="22" cy="76" r="10" fill="#2a2d3a" stroke="#8b8fa3" stroke-width="1.5"/>
  <circle cx="178" cy="76" r="10" fill="#2a2d3a" stroke="#8b8fa3" stroke-width="1.5"/>
  <!-- Belt surface -->
  <rect x="30" y="72" width="140" height="8" rx="2" fill="rgba(108,92,231,0.12)"/>
  <!-- Belt motion lines -->
  <line x1="50" y1="76" x2="60" y2="76" stroke="#8b8fa3" stroke-width="0.8" opacity="0.4"/>
  <line x1="85" y1="76" x2="95" y2="76" stroke="#8b8fa3" stroke-width="0.8" opacity="0.4"/>
  <line x1="120" y1="76" x2="130" y2="76" stroke="#8b8fa3" stroke-width="0.8" opacity="0.4"/>
  <line x1="150" y1="76" x2="160" y2="76" stroke="#8b8fa3" stroke-width="0.8" opacity="0.4"/>
  <!-- Vial 1 -->
  <rect x="42" y="38" width="14" height="32" rx="3" fill="rgba(108,92,231,0.2)" stroke="#6c5ce7" stroke-width="1.2"/>
  <rect x="43" y="34" width="12" height="6" rx="1.5" fill="#fdcb6e"/>
  <rect x="44" y="52" width="10" height="16" rx="2" fill="rgba(116,185,255,0.35)"/>
  <!-- Vial 2 -->
  <rect x="88" y="38" width="14" height="32" rx="3" fill="rgba(108,92,231,0.2)" stroke="#6c5ce7" stroke-width="1.2"/>
  <rect x="89" y="34" width="12" height="6" rx="1.5" fill="#fdcb6e"/>
  <rect x="90" y="48" width="10" height="20" rx="2" fill="rgba(116,185,255,0.35)"/>
  <!-- Vial 3 -->
  <rect x="134" y="38" width="14" height="32" rx="3" fill="rgba(108,92,231,0.2)" stroke="#6c5ce7" stroke-width="1.2"/>
  <rect x="135" y="34" width="12" height="6" rx="1.5" fill="#fdcb6e"/>
  <rect x="136" y="55" width="10" height="13" rx="2" fill="rgba(116,185,255,0.35)"/>
  <!-- Fill nozzle above vial 2 -->
  <rect x="92" y="10" width="8" height="20" rx="1" fill="#8b8fa3"/>
  <path d="M90 10h12l-2-6h-8z" fill="#8b8fa3"/>
  <!-- Drip from nozzle -->
  <circle cx="96" cy="32" r="1.5" fill="#74b9ff"/>
  <!-- Support legs -->
  <line x1="22" y1="86" x2="22" y2="110" stroke="#8b8fa3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="178" y1="86" x2="178" y2="110" stroke="#8b8fa3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Output arrow -->
  <line x1="188" y1="76" x2="198" y2="76" stroke="#8b8fa3" stroke-width="1.5"/>
  <polygon points="196,72 200,76 196,80" fill="#8b8fa3"/>
</svg>
