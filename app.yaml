command:
  - "/bin/sh"
  - "-c"
  - "uvicorn app:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000}"

env:
  # ── App backend Lakebase (stores pipelines + user_settings) ──
  - name: PGHOST
    value: "ep-young-pine-d3cm83xf.database.eu-west-1.cloud.databricks.com"
  - name: PGDATABASE
    value: "databricks_postgres"
  - name: PGPORT
    value: "5432"
  - name: LAKEBASE_ENDPOINT
    value: "projects/iot-digital-twin/branches/production/endpoints/primary"

  # ── Zerobus (not configured on e2-demo-emea; Zerobus sink will no-op) ──
  - name: ZEROBUS_SERVER_ENDPOINT
    value: ""
  - name: ZEROBUS_TABLE_NAME
    value: ""
  - name: ZEROBUS_CLIENT_ID
    value: ""
  - name: ZEROBUS_SECRET_SCOPE
    value: ""
  - name: ZEROBUS_SECRET_KEY
    value: ""

  # ── Unity Catalog managed storage (metastore storage_root, eu-west-1) ──
  - name: UC_STORAGE_ROOT
    value: "s3://databricks-uc-e2-demo-emea-ireland/155e600b-57c2-43e2-a38c-fb7a40bfb81e"

  - name: INDUSTRIES
    value: "pharmaceutical"

  # ── LakeTS source for per-pipeline tiering ──
  # Vendored inside the repo; the Apps runtime has no network egress for git.
  - name: LAKETS_SQL_PATH
    value: "/app/python/source_code/databricks/vendor/lakets.sql"
