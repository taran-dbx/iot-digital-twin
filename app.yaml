command:
  - "/bin/sh"
  - "-c"
  - "uvicorn app:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000}"

env:
  # ── Lakebase (fe-vm-shared-interop / us-east-1).  iot-lakets-demo serves
  #    as both the app backend and the demo streaming target. ──
  - name: PGHOST
    value: "ep-fancy-king-d2l9rua6.database.us-east-1.cloud.databricks.com"
  - name: PGDATABASE
    value: "databricks_postgres"
  - name: PGPORT
    value: "5432"
  - name: LAKEBASE_ENDPOINT
    value: "projects/iot-lakets-demo/branches/production/endpoints/primary"

  # ── Zerobus: enables UI panel + SP catalog grants.
  #    TABLE_NAME left empty so the legacy in-app sink stays OFF;
  #    the real ingest path is the per-pipeline producer notebook. ──
  - name: ZEROBUS_SERVER_ENDPOINT
    value: "332040261549026.zerobus.us-east-1.cloud.databricks.com"
  - name: ZEROBUS_TABLE_NAME
    value: ""
  - name: ZEROBUS_CLIENT_ID
    value: "01329a59-2dff-480c-ab9f-29a4e87f3bbd"
  - name: ZEROBUS_SECRET_SCOPE
    value: "iot-secrets"
  - name: ZEROBUS_SECRET_KEY
    value: "zerobus-client-secret"

  # ── Unity Catalog: let create_catalog default to metastore-managed
  #    storage — setting UC_STORAGE_ROOT to the metastore's own root
  #    collides with its default managed-storage region
  #    ("overlaps with managed storage within CreateCatalog").  The SP
  #    already has CREATE_MANAGED_STORAGE on the default location. ──
  - name: UC_STORAGE_ROOT
    value: ""

  - name: INDUSTRIES
    value: "pharmaceutical"

  # ── LakeTS source — vendored; Apps runtime has no git egress ──
  - name: LAKETS_SQL_PATH
    value: "/app/python/source_code/databricks/vendor/lakets.sql"
